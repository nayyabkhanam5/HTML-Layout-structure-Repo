<!DOCTYPE html>
<html>
<head>
    <title>Event Registration Form</title>
</head>
<body>

    <h1>Event Registration Form</h1>
    <p>Please fill out this form to register for the upcoming tech event.</p>

    <form>

        <label>Participant Name</label><br>
        <input type="text" placeholder="Enter your name"><br><br>

        <label>Contact Email</label><br>
        <input type="email" placeholder="Enter your email"><br><br>

        <label>Phone Number</label><br>
        <input type="number" placeholder="Enter your phone number"><br><br>

        <label>Select Your Profession</label><br>
        <select>
            <option>Choose your profession</option>
            <option>Student</option>
            <option>Teacher</option>
            <option>Developer</option>
            <option>Designer</option>
        </select><br><br>

        <p>How did you hear about this event?</p>

        <input type="radio" name="source"> Social Media<br>
        <input type="radio" name="source"> Friends<br>
        <input type="radio" name="source"> Website<br>
        <input type="radio" name="source"> Advertisement<br><br>

        <p>Which activities are you interested in?</p>

        <input type="checkbox"> Coding Workshop<br>
        <input type="checkbox"> Networking Session<br>
        <input type="checkbox"> Startup Ideas<br>
        <input type="checkbox"> AI Discussion<br><br>

        <label>Additional Comments</label><br>

        <textarea rows="5" cols="40" placeholder="Write your comments here..."></textarea><br><br>

        <button type="submit">Register Now</button>

    </form>

</body>
</html>
